<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="renderer.js" type="module"></script>
    <title>Schematic Generator</title>
</head>
<body class="bg-gray-100 flex h-screen p-4">
    <div class="flex flex-col w-96 mr-4 space-y-6">
        <div class="bg-white p-6 rounded shadow-md w-96 ">
            <h1 class="text-xl font-bold mb-4">SVG Schematic Generator</h1>
            <form id="svg-form">
                <div class="mb-4">
                    <label for="svg" class="block mb-1 ">SVG</label>
                    <textarea id="svg" class="block h-16 border rounded w-full px-2 py-1" required></textarea>
                </div>
                <div class="mb-4">
                    <label for="baseName" class="block mb-1">Base Name</label>
                    <input type="text" id="baseName" class="border rounded w-full px-2 py-1" required>
                </div>
                <div class="mb-4">
                    <label for="baseHeight" class="block mb-1">Base Height</label>
                    <input type="number" id="baseHeight" class="border rounded w-full px-2 py-1" required>
                </div>
                <div class="mb-4">
                    <label for="rotation" class="block mb-1">Rotation</label>
                    <input type="number" id="rotation" class="border rounded w-full px-2 py-1" required>
                </div>
                <div class="mb-4">
                    <label for="sizeX" class="block mb-1">Size X</label>
                    <input type="number" id="sizeX" class="border rounded w-full px-2 py-1" required>
                </div>
                <div class="mb-4">
                    <label for="sizeY" class="block mb-1">Size Y</label>
                    <input type="number" id="sizeY" class="border rounded w-full px-2 py-1" required>
                </div>
                <div class="flex justify-center">
                    <button type="submit" class="inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm shadow rounded-md text-white bg-indigo-500 hover:bg-indigo-400 transition ease-in-out duration-150">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Create</span>
                    </button>
                </div>
            </form>
            <div id="svg-response" class="mt-4"></div>
        </div>
    
        <div class="bg-white p-6 rounded shadow-md w-96">
            <form id="drububu-form">
                <h2 class="text-lg font-bold mb-4"></h2>
                <p>This follows the format x,y,z,r,g,b and can be generated from <a class="text-blue-500 hover:underline" href="https://drububu.com/miscellaneous/voxelizer/?out=txt">drububu</a></p>
                <div class="flex flex-col mt-4">
                    <div class="mb-4">
                        <label for="drububu-baseName" class="block mb-1">Base Name</label>
                        <input type="text" id="drububu-baseName" class="border rounded w-full px-2 py-1" required>
                    </div>
                    <div class="mb-4">
                        <label for="drububu-sizeX" class="block mb-1">Size X</label>
                        <input type="number" id="drububu-sizeX" class="border rounded w-full px-2 py-1" required>
                    </div>
                    <div class="mb-4">
                        <label for="drububu-sizeY" class="block mb-1">Size Y</label>
                        <input type="number" id="drububu-sizeY" class="border rounded w-full px-2 py-1" required>
                    </div>
                    <label for="drububu-file-upload" class="flex cursor-pointer items-center gap-2 rounded-xl border-2 border-dashed border-gray-400 bg-gray-50 px-6 py-4 text-gray-600 transition hover:border-indigo-500 hover:text-indigo-600 hover:bg-indigo-50">
                        <svg class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <span class="text-base font-medium">Upload file</span>
                        <input id="drububu-file-upload" name="file" type="file" class="hidden" required/>
                    </label>
                </div>
                <div class="flex justify-center mt-4">
                    <button type="submit" class="inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm shadow rounded-md text-white bg-green-500 hover:bg-green-400 transition ease-in-out duration-150">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Upload</span>
                    </button>
                </div>
                <div id="drububu-response" class="mt-4"></div>
            </form>
        </div>

        <div class="bg-white p-6 rounded shadow-md w-96">
            <h2 class="text-lg font-bold mb-4">Previous Schematics</h2>
            <ul id="schematic-list"></ul>
            <select id="schematic-select" class="border rounded w-full px-2 py-1 mb-4"></select>
            <div class="flex justify-center">
                <button id="load-schematic" type="submit" class="inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm shadow rounded-md text-white bg-green-500 hover:bg-green-400 transition ease-in-out duration-150">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Load</span>
                </button>
            </div>
            <div id="schematic-content" class="mt-4"></div>
        </div>
    </div>
    <div id="renderer" class="flex grow-1 w-full"></div>
    <script>
        document.getElementById('svg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const baseName = document.getElementById('baseName').value;
            const baseHeight = document.getElementById('baseHeight').value;
            const rotation = document.getElementById('rotation').value;
            const sizeX = document.getElementById('sizeX').value;
            const sizeY = document.getElementById('sizeY').value;
            const svg = document.getElementById('svg').value

            document.querySelector('#svg-form button svg').classList.remove('hidden')
            document.querySelector('#svg-form button span').innerText = 'Processing...'

            document.getElementById('svg-response').innerText = ''

            const response = await fetch('/api/generate/svg', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ baseHeight, rotation, sizeX, sizeY, baseName, svg, type: 'svg' })
            });

            document.querySelector('#svg-form button svg').classList.add('hidden')
            document.querySelector('#svg-form button span').innerText = 'Create'

            const data = await response.json();
            document.getElementById('svg-response').innerText = data.message || data.error;
            loadSchematics()
        });

        document.getElementById('drububu-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const baseName = document.getElementById('drububu-baseName').value;
            const sizeX = document.getElementById('drububu-sizeX').value;
            const sizeY = document.getElementById('drububu-sizeY').value;

            document.querySelector('#drububu-form button svg').classList.remove('hidden')
            document.querySelector('#drububu-form button span').innerText = 'Processing...'

            document.getElementById('drububu-response').innerText = ''

            const formData = new FormData();
            formData.append('baseName', baseName);
            formData.append('sizeX', sizeX);
            formData.append('sizeY', sizeY);

            if (fileInput.files.length > 0) {
                formData.append('file', fileInput.files[0]);
            }

            try {
                const response = await fetch('/api/generate/drububu', {
                    method: 'POST',
                    body: formData,
                }).catch(e => console.log(e)).finally(() => console.log('final'));

                const data = await response.json();
                document.getElementById('drububu-response').innerText = data.message || data.error;
                loadSchematics()
            } catch(e) {
                document.getElementById('drububu-response').innerText = e.toString();
            } finally {
                document.querySelector('#drububu-form button svg').classList.add('hidden')
                document.querySelector('#drububu-form button span').innerText = 'Upload'

            }        
        });

        const fileInput = document.getElementById('drububu-file-upload');
        const fileNameEl = document.getElementById('drububu-file-upload').parentNode.querySelector('span');

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
            fileNameEl.textContent = fileInput.files[0].name;
            } else {
            fileNameEl.textContent = 'No file selected';
            }
        });

        async function loadSchematics() {
            const response = await fetch('/api/schematics');
            const schematics = await response.json();

            const select = document.getElementById('schematic-select');
            select.innerHTML = ''

            schematics.forEach(dir => {
                const option = document.createElement('option');
                option.value = dir;
                option.innerText = dir;
                select.appendChild(option);
            });
        }

        document.getElementById('load-schematic').addEventListener('click', async () => {
            const selectedSchematic = document.getElementById('schematic-select').value;
            
            document.querySelector('#load-schematic svg').classList.remove('hidden')
            document.querySelector('#load-schematic span').innerText = 'Loading...'

            const response = await fetch(`/api/schematics/${selectedSchematic}`);
            const data = await response.json();

            const contentDiv = document.getElementById('schematic-content');
            contentDiv.innerText = '';

            if (Array.isArray(data)) {
                const event = new CustomEvent("renderer/data", { detail: data });
                window.dispatchEvent(event);
            } else {
                contentDiv.innerText = data.error || 'No data found';
            }

            // Load options for the selected schematic
            const optionsResponse = await fetch(`/api/schematics/${selectedSchematic}/options`);
            const optionsData = await optionsResponse.json();
            if (!optionsResponse.ok) {
                document.getElementById('response').innerText = optionsData.error;
                return;
            }

            
            document.querySelector('#load-schematic svg').classList.add('hidden')
            document.querySelector('#load-schematic span').innerText = 'Load'

            // Populate the form with the loaded options
            document.getElementById('baseHeight').value = optionsData.baseHeight;
            document.getElementById('rotation').value = optionsData.rotation;
            document.getElementById('sizeX').value = optionsData.sizeX;
            document.getElementById('sizeY').value = optionsData.sizeY;
            document.getElementById('baseName').value = optionsData.baseName;
            document.getElementById('svg').value = optionsData.svg;
        });

        // Load schematics on page load
        window.onload = loadSchematics;
    </script>
</body>
</html>
